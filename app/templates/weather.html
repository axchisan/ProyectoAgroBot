<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consulta Climática - Agrobot</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container">
        <h2 class="text-center mt-4 fw-bold">AGROBOT 🌱</h2>
        <div class="card">
            <div class="chat-message">
                <p><strong>Usuario:</strong> ¿Cuál es el clima local?</p>
            </div>
            <div class="chat-message bg-success text-white p-3 rounded">
                <p><img src="https://img.icons8.com/ios-filled/24/ffffff/sun.png" class="icon" alt="Temperatura"> La temperatura actual es de 22°C.</p>
                <p><img src="https://img.icons8.com/ios-filled/24/ffffff/humidity.png" class="icon" alt="Humedad"> La humedad es del 65%.</p>
                <p><img src="https://img.icons8.com/ios-filled/24/ffffff/watering-can.png" class="icon" alt="Riego"> Hoy no se recomienda el riego.</p>
            </div>
            <div class="mt-3 d-flex gap-2">
                <a href="#" class="btn btn-secondary-custom">Ver pronóstico completo</a>
                <a href="{{ url_for('main.index') }}" class="btn btn-outline-secondary rounded-pill">Volver al inicio</a>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
