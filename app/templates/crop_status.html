<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estado del Cultivo - Agrobot</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container">
        <h2 class="text-center mt-4 fw-bold">AGROBOT 🌱</h2>
        <div class="card">
            <h5>Estado del Cultivo</h5>
            <div class="mb-3">
                <label>Nivel de crecimiento</label>
                <div class="progress">
                    <div class="progress-bar" style="width: 70%"></div>
                </div>
            </div>
            <div class="mb-3">
                <label>Necesidad de riego</label>
                <div class="progress">
                    <div class="progress-bar bg-danger" style="width: 90%"></div>
                </div>
            </div>
            <div class="mb-3">
                <label>Plagas detectadas</label>
                <div class="progress">
                    <div class="progress-bar bg-warning" style="width: 10%"></div>
                </div>
            </div>
            <div class="chat-message">
                <p><strong>Agrobot:</strong> El crecimiento de los cultivos es bueno. Se requiere riego pronto. Una plaga ha sido detectada. Recomiendo tomar acción.</p>
            </div>
            <div class="mt-3 d-flex gap-2">
                <a href="#" class="btn btn-secondary-custom">Ver reporte completo</a>
                <a href="#" class="btn btn-outline-success rounded-pill">Tomar acción</a>
            </div>
            <a href="{{ url_for('main.index') }}" class="btn btn-outline-secondary rounded-pill mt-2">Volver al inicio</a>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
