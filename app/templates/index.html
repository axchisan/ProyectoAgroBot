<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bienvenido a Agrobot</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="landing-page">
    <div class="landing-container">
        <div class="hero-section">
            <div class="robot-container">
                <div class="robot-avatar">
                    <img src="{{ url_for('static', filename='images/robot.png') }}" alt="Agrobot" class="robot-image">
                </div>
            </div>
            
            <div class="hero-content">
                <h1 class="hero-title">¡Bienvenido a <span class="brand-name">AGROBOT</span>!</h1>
                <p class="hero-subtitle">Tu asistente agrícola inteligente</p>
                <p class="hero-description">Consulta clima, mejora tus cultivos y recibe asesoría al instante</p>
                
                <div class="cta-section">
                    <a href="{{ url_for('main.chat') }}" class="btn-primary-custom">
                        <i class="fas fa-play"></i>
                        Comenzar
                    </a>
                </div>
                
                <div class="features-preview">
                    <div class="feature-item">
                        <i class="fas fa-cloud-sun"></i>
                        <span>Clima en tiempo real</span>
                    </div>
                    <div class="feature-item">
                        <i class="fas fa-seedling"></i>
                        <span>Recomendaciones personalizadas</span>
                    </div>
                    <div class="feature-item">
                        <i class="fas fa-chart-line"></i>
                        <span>Análisis de cultivos</span>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="floating-elements">
            <div class="cloud cloud-1">☁️</div>
            <div class="cloud cloud-2">☁️</div>
            <div class="cloud cloud-3">☁️</div>
            <div class="sun">☀️</div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
