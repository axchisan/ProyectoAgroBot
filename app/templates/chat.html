<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat con Agrobot</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container">
        <h2 class="text-center mt-4 fw-bold">AGROBOT 🌱</h2>
        <div class="card chat-container">
            <div class="chat-history" id="chatHistory">
                {% for message in chat_history %}
                    <div class="chat-message {{ 'user-message' if message.role == 'user' else 'agrobot-message' }}">
                        <p><strong>{{ 'Tú' if message.role == 'user' else 'Agrobot' }}:</strong> 
                            {{ message.message | replace('**', '') | replace('', '') | safe }}
                        </p>
                    </div>
                {% endfor %}
            </div>
            <form method="POST" id="chatForm">
                <div class="mb-3 position-relative">
                    <input type="text" class="form-control rounded-pill" name="user_input" id="userInput" placeholder="Escribe tu pregunta..." required>
                    <div id="loading" class="position-absolute top-50 end-0 translate-middle-y d-none">
                        <div class="spinner-border text-success" role="status">
                            <span class="visually-hidden">Cargando...</span>
                        </div>
                    </div>
                </div>
                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-secondary-custom">Enviar</button>
                    <a href="{{ url_for('main.index') }}" class="btn btn-outline-secondary rounded-pill">Volver al inicio</a>
                    <button type="button" class="btn btn-outline-danger rounded-pill" onclick="if(confirm('¿Estás seguro de vaciar el chat?')) window.location.href='{{ url_for('main.clear_chat') }}'">Vaciar Chat</button>
                </div>
            </form>
            <div class="mt-3 d-flex flex-wrap gap-2">
                <a href="{{ url_for('main.weather') }}" class="btn btn-outline-primary rounded-pill">
                    <img src="https://img.icons8.com/ios-filled/24/000000/cloud.png" class="icon" alt="Clima"> Consultar Clima
                </a>
                <a href="{{ url_for('main.recommendations') }}" class="btn btn-outline-primary rounded-pill">
                    <img src="https://img.icons8.com/ios-filled/24/000000/wheat.png" class="icon" alt="Siembra"> Recomendaciones de Siembra
                </a>
                <a href="{{ url_for('main.crop_status') }}" class="btn btn-outline-primary rounded-pill">
                    <img src="https://img.icons8.com/ios-filled/24/000000/plant.png" class="icon" alt="Cultivo"> Estado del Cultivo
                </a>
                <a href="{{ url_for('main.support') }}" class="btn btn-outline-primary rounded-pill">
                    <img src="https://img.icons8.com/ios-filled/24/000000/headset.png" class="icon" alt="Soporte"> Soporte
                </a>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const chatHistory = document.querySelector('#chatHistory');
            chatHistory.scrollTop = chatHistory.scrollHeight;

            const form = document.querySelector('#chatForm');
            const loading = document.querySelector('#loading');
            const userInput = document.querySelector('#userInput');

            form.addEventListener('submit', (e) => {
                loading.classList.remove('d-none');
                // Simular retraso para respuestas instantáneas 
                setTimeout(() => {
                    loading.classList.add('d-none');
                }, 500); 
            });

            // Detectar si la respuesta viene de API y ajustar tiempo de carga
            const lastMessage = chatHistory.lastElementChild;
            if (lastMessage && !lastMessage.textContent.includes('No pude obtener')) {
                const delay = Math.random() * 2000 + 1000; // 1-3 segundos
                loading.classList.remove('d-none');
                setTimeout(() => {
                    loading.classList.add('d-none');
                }, delay);
            }
        });
    </script>
</body>
</html>
