<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recomendaciones de Siembra - Agrobot</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container">
        <h2 class="text-center mt-4 fw-bold">AGROBOT 🌱</h2>
        <div class="card">
            <h5>Recomendaciones para siembra</h5>
            <ul class="list-group list-group-flush">
                <li class="list-group-item"><img src="https://img.icons8.com/ios-filled/24/000000/corn.png" class="icon" alt="Fecha"> Mejor fecha de siembra</li>
                <li class="list-group-item"><img src="https://img.icons8.com/ios-filled/24/000000/wheat.png" class="icon" alt="Fertilizante"> Tipo de fertilizante</li>
                <li class="list-group-item"><img src="https://img.icons8.com/ios-filled/24/000000/sunflower.png" class="icon" alt="Rotación"> Rotación de cultivos</li>
            </ul>
            <div class="mt-3 d-flex gap-2">
                <a href="#" class="btn btn-secondary-custom">Ver más detalles</a>
                <a href="#" class="btn btn-outline-success rounded-pill">Aplicar recomendación</a>
            </div>
            <a href="{{ url_for('main.index') }}" class="btn btn-outline-secondary rounded-pill mt-2">Volver al inicio</a>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
